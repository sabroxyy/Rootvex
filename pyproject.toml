[project]
name = "netwarden"
version = "0.1.0"
description = "Self-hosted AI agent for network and security troubleshooting (lab only)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyyaml==6.0.4",
    "structlog==26.1.0",
    "typer==0.29.2",
    "rich==15.0.0",
    # Phase 2 - agent loop
    "langgraph==1.2.24",
    "langchain-core==1.8.4",
    "langchain-openai==1.8.5",
    # Phase 3 - device access
    "netmiko==4.8.0",
]

[project.scripts]
netwarden = "netwarden.cli:app"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
