# Rootvex settings. Environment variables (ROOTVEX_*) override these.
# Nested keys use a double underscore, e.g. ROOTVEX_LLM__MODEL.

llm:
  base_url: http://localhost:11434/v1   # Ollama; vLLM/llama.cpp serve the same API
  model: granite4:3b
  temperature: 0.0
  request_timeout_s: 300
  max_tokens: 2048          # per model call; stops "thinking" models rambling
  reasoning_effort: null    # reasoning models only: none | low | medium | high

agent:
  max_steps: 12        # max tool calls per run
  timeout_s: 300       # wall-clock limit per run
  max_output_chars: 6000   # device output is truncated to this before the model sees it

lab:
  # Every inventory host must be inside one of these. Never add the home LAN.
  allowed_networks:
    - 10.99.0.0/24
  inventory_file: config/inventory.local.yaml
  allowlist_dir: config/allowlist
  # "netmiko" = real SSH to the lab; "fixtures" = canned outputs (no devices needed)
  device_backend: netmiko
  fixtures_dir: tests/fixtures

logging:
  dir: logs
  level: INFO

web:
  host: 127.0.0.1        # local only; the password comes from .env (ROOTVEX_WEB__PASSWORD)
  port: 8000
  user: engineer
  db_file: data/rootvex.db

router:
  # Optional cloud models for rootvex.router. Keep "local" for anything with real customer data.
  # local  = everything on the llm: model above; nothing leaves the network
  # hybrid = device output summarized locally; only the redacted summary goes to the cloud
  # cloud  = Gemini reads, Claude reasons, Gemini reviews; everything redacted first
  mode: local
  analyze:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.5-flash          # check Google's docs for current model names
    api_key_env: GEMINI_API_KEY
  reason:
    base_url: https://api.anthropic.com/v1/
    model: claude-sonnet-5-5         # check Anthropic's docs for current model names
    api_key_env: ANTHROPIC_API_KEY
  review:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
  redact_before_cloud: true
  extra_terms: []                    # e.g. company or site names to hide
  request_timeout_s: 120
  max_tokens: 2048
  log_redacted_prompts: true         # audit copy of exactly what left the network
