<title>Rootvex Lab Topology</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Layout: full-screen 3D scene (two stacked planes: data above, management below),
     with a slim header, a control strip and a device detail panel floating over it.
     Deliberately single-theme: a dark lab console, set explicitly for both host themes. */
  :root {
    --bg: #0e1519;
    --bg-2: #142027;
    --panel: rgba(18, 28, 34, 0.88);
    --line: #2a3a43;
    --fg: #dde7ea;
    --muted: #8ea2aa;
    --data: #5fc4c0;     /* data-plane links */
    --mgmt: #e0a94a;     /* management plane, VRF MGMT */
    --tunnel: #c98be8;   /* IPsec VTI */
    --planned: #7d8d94;
    --hq: #2f6f8f;
    --isp: #6b6f86;
    --branch: #3f7a5a;
    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  .lbl {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -100%);
    font-family: var(--font-mono); font-size: 11px; line-height: 1.25;
    white-space: nowrap; text-align: center;
    color: var(--fg);
    text-shadow: 0 1px 3px var(--bg), 0 0 6px var(--bg);
  }
  .lbl b { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; display: block; }
  .lbl span { color: var(--muted); }
  .lbl.link { transform: translate(-50%, -50%); font-size: 10px; color: var(--data); }
  .lbl.link.mg { color: var(--mgmt); }
  .lbl.link.tn { color: var(--tunnel); }
  .lbl.zone { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); transform: translate(-50%, -50%); }
  .lbl.plane { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; transform: translate(0, -50%); text-align: left; }
  .lbl.plane.mg { color: var(--mgmt); }
  .lbl.plane.dp { color: var(--data); }
  .hide-ip .ip { display: none; }
  .hide-mgmt .mgonly { display: none; }
  .hide-planned .plonly { display: none; }

  header {
    position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
    pointer-events: none;
  }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; }

  .controls {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 52px);
    left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 32px);
  }
  .controls button {
    font: 500 12px var(--font-body);
    color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .controls button[aria-pressed="false"] { color: var(--muted); }
  .controls button[aria-pressed="false"] .sw { opacity: 0.3; }
  .controls button:hover { border-color: var(--muted); }
  .controls button:focus-visible, .chip:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
  .sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }

  aside {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: min(340px, calc(100% - 32px));
    max-height: calc(100% - 150px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 14px 16px;
    backdrop-filter: blur(6px);
    font-size: 13px; line-height: 1.5;
  }
  aside h2 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: 0.03em; }
  aside .role { color: var(--muted); margin: 0 0 10px; }
  aside h3 { margin: 12px 0 4px; font: 500 11px var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  aside table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  aside td { padding: 3px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  aside td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  aside ul { margin: 0; padding-left: 18px; }
  aside li { margin: 2px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip {
    font: 500 12px var(--font-mono); color: var(--fg);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 7px; cursor: pointer;
  }
  .chip:hover { border-color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .tag { display: inline-block; font: 500 10px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 3px; }
  .tag.plan { border: 1px dashed var(--planned); color: var(--muted); }

  @media (max-width: 640px) {
    aside { max-height: 42%; }
    .sub { display: none; }
  }
</style>

<canvas id="scene" aria-label="3D view of the Rootvex GNS3 lab topology"></canvas>
<div id="labels"></div>

<header>
  <h1>Rootvex Lab Topology</h1>
  <div class="sub">GNS3 on Ubuntu · data plane above, out-of-band management (VRF MGMT) below · drag to orbit, scroll to zoom</div>
</header>

<div class="controls" role="toolbar" aria-label="View options">
  <button id="t-ip" aria-pressed="true"><span class="sw" style="background:var(--data)"></span>Addresses</button>
  <button id="t-mgmt" aria-pressed="true"><span class="sw" style="background:var(--mgmt)"></span>Management plane</button>
  <button id="t-plan" aria-pressed="false"><span class="sw" style="background:var(--planned)"></span>Stage C: FW1</button>
  <button id="t-anim" aria-pressed="true"><span class="sw" style="background:var(--tunnel)"></span>Traffic</button>
  <button id="t-reset">Reset view</button>
</div>

<aside id="detail" aria-live="polite"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const css = getComputedStyle(document.documentElement);
  const C = (name) => new THREE.Color(css.getPropertyValue(name).trim());
  const COL = {
    bg: C('--bg'), data: C('--data'), mgmt: C('--mgmt'), tunnel: C('--tunnel'), planned: C('--planned'),
    hq: C('--hq'), isp: C('--isp'), branch: C('--branch'), line: C('--line'),
  };
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Lab data (from docs/DESIGN.md section 9) ---------------------------------
  const MGMT_Y = -6.5;
  const nodes = {
    PC1:  { pos: [-13, 0, 0], kind: 'pc', zone: 'HQ', role: 'HQ user PC · GNS3 docker gns3/ipterm',
            iface: [['eth0', '10.10.10.10/24, gw 10.10.10.1']], ram: '~30 MB',
            faults: ['Wrong default gateway (user can’t reach website)'] },
    SW1:  { pos: [-8.5, 0, 0], kind: 'switch', zone: 'HQ', role: 'Access switch · Cisco IOSvL2', mgmt: '10.99.0.21 (SVI VLAN 99)',
            iface: [['Gi1/0', 'access VLAN 10 → PC1'], ['Gi0/1', '→ R1 Gi0/2'], ['Gi0/0', 'access VLAN 99 → MGMT-SW']], ram: '768 MB',
            faults: ['Port-security err-disable on Gi1/0', 'Speed/duplex mismatch'] },
    R1:   { pos: [-4, 0, 0], kind: 'router', zone: 'HQ', role: 'HQ router · Cisco IOSv · OSPF area 0', mgmt: '10.99.0.11 (Gi0/0, VRF MGMT)',
            iface: [['Gi0/1', '10.0.12.1/30 → R2'], ['Gi0/2', '10.10.10.1/24 HQ LAN']], ram: '512 MB',
            faults: ['OSPF area / hello-dead / MTU / auth mismatch with R2', 'passive-interface on Gi0/1', 'Interface shutdown'] },
    R2:   { pos: [0.5, 0, 0], kind: 'router', zone: 'HQ', role: 'HQ edge · Cisco IOSv · NAT, eBGP, IPsec', mgmt: '10.99.0.12 (Gi0/0, VRF MGMT)',
            iface: [['Gi0/1', '10.0.12.2/30 → R1'], ['Gi0/2', '203.0.113.1/30 → ISP1'], ['Tunnel0', '172.16.0.1/30 IPsec VTI → BR1']], ram: '512 MB',
            faults: ['eBGP: wrong remote-as / neighbor IP / ACL on TCP 179', 'NAT missing', 'IPsec PSK or transform-set mismatch'] },
    ISP1: { pos: [6, 0, 0], kind: 'router', zone: 'ISP', role: 'ISP router · Cisco IOSv · AS 65100 · DNS', mgmt: '10.99.0.14 (Gi0/0, VRF MGMT)',
            iface: [['Gi0/1', '203.0.113.2/30 → R2'], ['Gi0/2', '198.51.100.1/30 → BR1'], ['Gi0/3', '192.0.2.1/24 → WEB1'], ['DNS', 'ip host www.lab.test 192.0.2.80']], ram: '512 MB',
            faults: ['DNS host entry missing', 'ISP link down (VPN and BGP drop)'] },
    WEB1: { pos: [8, 0, 4.2], kind: 'server', zone: 'ISP', role: 'Web server · docker nginx:alpine',
            iface: [['eth0', '192.0.2.80/24 · www.lab.test']], ram: '~20 MB',
            faults: ['Container stopped'] },
    BR1:  { pos: [11.5, 0, 0], kind: 'router', zone: 'Branch', role: 'Branch router · Cisco IOSv · AS 65002', mgmt: '10.99.0.13 (Gi0/0, VRF MGMT)',
            iface: [['Gi0/1', '198.51.100.2/30 → ISP1'], ['Gi0/2', '10.20.20.1/24 Branch LAN'], ['Tunnel0', '172.16.0.2/30 IPsec VTI → R2']], ram: '512 MB',
            faults: ['eBGP to ISP1 down', 'No route to IPsec peer', 'OSPF over tunnel down'] },
    PC2:  { pos: [16, 0, 0], kind: 'pc', zone: 'Branch', role: 'Branch user PC · GNS3 docker gns3/ipterm',
            iface: [['eth0', '10.20.20.10/24, gw 10.20.20.1']], ram: '~30 MB', faults: [] },
    FW1:  { pos: [3.25, 0, -4], kind: 'firewall', zone: 'HQ', planned: true, role: 'Stage C · FortiGate-VM between R2 and ISP1', mgmt: '10.99.0.31',
            iface: [['inside', '→ R2'], ['outside', '→ ISP1']], ram: '~2 GB',
            faults: ['Policy / NAT faults (Fortinet playbooks, later)'] },
    'MGMT-SW': { pos: [1.5, MGMT_Y, 11], kind: 'mswitch', zone: 'MGMT', role: 'GNS3 built-in Ethernet switch · management only',
            iface: [['LAN', '10.99.0.0/24']], ram: '0', faults: [] },
    HOST: { pos: [-8, MGMT_Y, 11], kind: 'host', zone: 'MGMT', label: 'Ubuntu host', role: 'Dell Precision 7810 · runs Rootvex + Ollama',
            iface: [['tap-nw', '10.99.0.1/24 (GNS3 Cloud node)']], ram: '15 GiB total',
            faults: [], note: 'Rootvex reaches devices only here, over SSH, with allowlisted read-only commands. No route to the internet or the home LAN (192.168.1.0/24).' },
  };
  const mgmtOf = ['SW1', 'R1', 'R2', 'ISP1', 'BR1'];

  const links = [
    { a: 'PC1', b: 'SW1', net: '10.10.10.0/24', note: 'VLAN 10' },
    { a: 'SW1', b: 'R1', net: '10.10.10.0/24' },
    { a: 'R1', b: 'R2', net: '10.0.12.0/30', note: 'OSPF area 0' },
    { a: 'R2', b: 'ISP1', net: '203.0.113.0/30', note: 'eBGP 65001↔65100' },
    { a: 'ISP1', b: 'BR1', net: '198.51.100.0/30', note: 'eBGP 65100↔65002' },
    { a: 'ISP1', b: 'WEB1', net: '192.0.2.0/24', lx: -1.4 },
    { a: 'BR1', b: 'PC2', net: '10.20.20.0/24' },
  ];

  // ---- Renderer, scene, camera --------------------------------------------------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = COL.bg;
  scene.fog = new THREE.Fog(COL.bg, 40, 80);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 8;
  controls.maxDistance = 70;

  function resetView() {
    const narrow = window.innerWidth < 700;
    camera.position.set(narrow ? 4 : 1.5, narrow ? 18 : 9, narrow ? 50 : 34);
    controls.target.set(1.5, -3.2, 3);
    controls.update();
  }

  scene.add(new THREE.HemisphereLight(0xcfe3ea, 0x0a1014, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(8, 20, 12);
  scene.add(sun);

  // ---- Planes and zones ---------------------------------------------------------
  const groups = { mgmt: new THREE.Group(), planned: new THREE.Group() };
  scene.add(groups.mgmt, groups.planned);
  groups.planned.visible = false;

  function slab(x0, x1, z0, z1, y, color, opacity) {
    const g = new THREE.BoxGeometry(x1 - x0, 0.12, z1 - z0);
    const m = new THREE.MeshStandardMaterial({ color, transparent: true, opacity, roughness: 0.9 });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
    scene.add(mesh);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.6 }));
    edges.position.copy(mesh.position);
    scene.add(edges);
    return mesh;
  }
  slab(-15.5, 2.6, -6, 7, -0.55, COL.hq, 0.22);
  slab(3.4, 9.2, -6, 7, -0.55, COL.isp, 0.22);
  slab(9.8, 18, -6, 7, -0.55, COL.branch, 0.22);

  const grid = new THREE.GridHelper(36, 36, COL.line, COL.line);
  grid.position.set(1, MGMT_Y - 0.5, 6);
  grid.material.transparent = true; grid.material.opacity = 0.35;
  groups.mgmt.add(grid);

  // ---- Device meshes ------------------------------------------------------------
  const pickables = [];
  function mat(color, extra) {
    return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.45, metalness: 0.35 }, extra || {}));
  }
  function buildDevice(name, n) {
    const g = new THREE.Group();
    const planned = !!n.planned;
    const op = planned ? { transparent: true, opacity: 0.55 } : {};
    let body;
    if (n.kind === 'router') {
      body = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.6, 40), mat(0x3d6f86, op));
      body.position.y = 0.3;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.05, 8, 40), mat(0xe6f2f4, op));
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.61;
      g.add(ring);
    } else if (n.kind === 'switch' || n.kind === 'mswitch') {
      body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 1.2), mat(n.kind === 'mswitch' ? 0x8a6a30 : 0x2f6f8f, op));
      body.position.y = 0.25;
      for (let i = 0; i < 6; i++) {
        const port = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.12, 0.04), mat(0x0e1519));
        port.position.set(-0.6 + i * 0.24, 0.27, 0.61);
        g.add(port);
      }
    } else if (n.kind === 'pc') {
      body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.75, 0.1), mat(0x55666e, op));
      body.position.y = 0.85;
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.6), new THREE.MeshBasicMaterial({ color: 0x5fc4c0, transparent: true, opacity: 0.55 }));
      screen.position.set(0, 0.85, 0.056);
      const stand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.12), mat(0x55666e));
      stand.position.y = 0.25;
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.35), mat(0x55666e));
      foot.position.y = 0.025;
      g.add(screen, stand, foot);
    } else if (n.kind === 'server') {
      body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.5, 0.9), mat(0x4b5a62, op));
      body.position.y = 0.75;
      for (let i = 0; i < 4; i++) {
        const led = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.02), new THREE.MeshBasicMaterial({ color: 0x5fc4c0 }));
        led.position.set(0, 0.35 + i * 0.3, 0.46);
        g.add(led);
      }
    } else if (n.kind === 'firewall') {
      body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.8, 0.9), mat(0xa4553a, op));
      body.position.y = 0.4;
    } else if (n.kind === 'host') {
      body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.5, 1.4), mat(0x2b3a42, op));
      body.position.y = 0.75;
      const led = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.6, 0.04), new THREE.MeshBasicMaterial({ color: 0xe0a94a }));
      led.position.set(0.46, 0.9, 0.4);
      g.add(led);
    }
    g.add(body);
    g.position.set(n.pos[0], n.pos[1], n.pos[2]);
    body.userData.name = name;
    pickables.push(body);
    n.mesh = body;
    n.group = g;
    const parent = planned ? groups.planned : (n.zone === 'MGMT' ? groups.mgmt : scene);
    parent.add(g);
  }
  Object.entries(nodes).forEach(([k, n]) => buildDevice(k, n));

  // ---- Links (tubes, since WebGL lines are always 1px) ----------------------------
  function tube(points, color, radius, opacity, parent) {
    const curve = points.length === 2
      ? new THREE.LineCurve3(points[0], points[1])
      : new THREE.CatmullRomCurve3(points);
    const geo = new THREE.TubeGeometry(curve, points.length === 2 ? 1 : 64, radius, 8, false);
    const m = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity });
    const mesh = new THREE.Mesh(geo, m);
    (parent || scene).add(mesh);
    return curve;
  }
  function dashed(a, b, color, parent) {
    const segs = Math.max(4, Math.round(a.distanceTo(b) / 0.5));
    for (let i = 0; i < segs; i += 2) {
      const p = a.clone().lerp(b, i / segs), q = a.clone().lerp(b, (i + 1) / segs);
      tube([p, q], color, 0.045, 0.8, parent);
    }
  }
  const V = (n, dy) => new THREE.Vector3(nodes[n].pos[0], nodes[n].pos[1] + (dy || 0), nodes[n].pos[2]);
  const LINK_Y = 0.3;
  const curves = {};
  links.forEach((l) => { curves[l.a + '-' + l.b] = tube([V(l.a, LINK_Y), V(l.b, LINK_Y)], COL.data, 0.07, 1); });

  // IPsec VTI tunnel: an arc over the ISP between R2 and BR1
  const tunnelPts = [V('R2', 0.7), new THREE.Vector3(3.5, 4.2, -1.2), new THREE.Vector3(8.5, 4.2, -1.2), V('BR1', 0.7)];
  const tunnelCurve = tube(tunnelPts, COL.tunnel, 0.06, 0.85);

  // Management: each device drops to the management plane, then runs to MGMT-SW
  const mgmtPaths = {};
  const mg = V('MGMT-SW', 0.25);
  mgmtOf.forEach((name) => {
    const top = V(name, 0.05);
    const floor = new THREE.Vector3(top.x, MGMT_Y + 0.25, top.z);
    tube([top, floor], COL.mgmt, 0.035, 0.6, groups.mgmt);
    tube([floor, mg], COL.mgmt, 0.035, 0.6, groups.mgmt);
    mgmtPaths[name] = [V('HOST', 0.4), mg, floor, top];
  });
  tube([V('HOST', 0.4), mg], COL.mgmt, 0.07, 1, groups.mgmt);

  // Planned FW1 (stage C): dashed links R2 - FW1 - ISP1 and its management drop
  dashed(V('R2', LINK_Y), V('FW1', LINK_Y), COL.planned, groups.planned);
  dashed(V('FW1', LINK_Y), V('ISP1', LINK_Y), COL.planned, groups.planned);

  // ---- Traffic pulses -------------------------------------------------------------
  const pulseGeo = new THREE.SphereGeometry(0.14, 12, 12);
  function polyCurve(pts) {
    const path = new THREE.CurvePath();
    for (let i = 0; i < pts.length - 1; i++) path.add(new THREE.LineCurve3(pts[i], pts[i + 1]));
    return path;
  }
  const webPath = polyCurve(['PC1', 'SW1', 'R1', 'R2', 'ISP1', 'WEB1'].map((n) => V(n, LINK_Y)));
  const pulses = [];
  function addPulse(curve, color, speed, offset, parent) {
    const m = new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({ color }));
    (parent || scene).add(m);
    pulses.push({ m, curve, speed, t: offset });
  }
  for (let i = 0; i < 3; i++) addPulse(webPath, 0xe9fbfa, 0.06, i / 3);
  for (let i = 0; i < 2; i++) addPulse(tunnelCurve, 0xf1dcff, 0.12, i / 2);
  const sshPulse = { m: new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({ color: 0xffe2a8 })), idx: 0, t: 0 };
  groups.mgmt.add(sshPulse.m);
  let sshPath = polyCurve(mgmtPaths[mgmtOf[0]]);

  // ---- HTML labels ----------------------------------------------------------------
  const labelLayer = document.getElementById('labels');
  const labels = [];
  function label(html, pos, cls, group) {
    const el = document.createElement('div');
    el.className = 'lbl ' + (cls || '');
    el.innerHTML = html;
    labelLayer.appendChild(el);
    labels.push({ el, pos, group });
    return el;
  }
  Object.entries(nodes).forEach(([k, n]) => {
    const top = n.kind === 'server' || n.kind === 'host' ? 1.8 : n.kind === 'pc' ? 1.45 : 1.0;
    const addr = n.mgmt ? n.mgmt.split(' ')[0] : (n.iface[0] ? n.iface[0][1].split(/[ ,·]/)[0] : '');
    const cls = n.planned ? 'plonly' : (n.zone === 'MGMT' ? 'mgonly' : '');
    label('<b>' + (n.label || k) + '</b><span class="ip">' + addr + '</span>', V(k, top), cls);
  });
  links.forEach((l) => {
    const mid = V(l.a, LINK_Y).add(V(l.b, LINK_Y)).multiplyScalar(0.5);
    mid.y += 0.55;
    mid.x += l.lx || 0;
    label(l.net + (l.note ? '<br>' + l.note : ''), mid, 'link ip');
  });
  label('Tunnel0 IPsec VTI<br>172.16.0.0/30 · OSPF area 0', new THREE.Vector3(6, 4.9, -1.2), 'link tn ip');
  label('10.99.0.0/24 · SSH only', mg.clone().add(new THREE.Vector3(-4.2, 0.4, 0)), 'link mg ip mgonly');
  label('HQ · AS 65001', new THREE.Vector3(-6.5, -0.4, 6.4), 'zone');
  label('ISP · AS 65100', new THREE.Vector3(6, -0.4, 6.4), 'zone');
  label('Branch · AS 65002', new THREE.Vector3(13.7, -0.4, 6.4), 'zone');
  label('Data plane', new THREE.Vector3(-17.5, 0, 0), 'plane dp');
  label('Management plane · VRF MGMT', new THREE.Vector3(-17.5, MGMT_Y, 9), 'plane mg mgonly');

  // ---- Detail panel ---------------------------------------------------------------
  const detail = document.getElementById('detail');
  let selected = null;
  function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  function chips() {
    return '<div class="chips">' + Object.keys(nodes).map((k) =>
      '<button class="chip" data-node="' + k + '">' + (nodes[k].label || k) + '</button>').join('') + '</div>';
  }
  function showOverview() {
    detail.innerHTML =
      '<h2>Stage B lab</h2><p class="role">10 nodes, about 3.5 GB RAM on the 15 GiB host</p>' +
      '<table>' +
      '<tr><td>Routing</td><td>OSPF area 0 in HQ and over the tunnel; eBGP to the ISP</td></tr>' +
      '<tr><td>VPN</td><td>R2 ↔ BR1 IPsec VTI across ISP1</td></tr>' +
      '<tr><td>Agent scope</td><td>allowed_networks = 10.99.0.0/24 only</td></tr>' +
      '<tr><td>Test target</td><td>PC1 → www.lab.test (192.0.2.80)</td></tr>' +
      '</table>' +
      '<h3>Devices</h3>' + chips() +
      '<p class="hint">Click a device in the scene or above for its interfaces and the faults the lab can inject there.</p>';
  }
  function showNode(k) {
    const n = nodes[k];
    let h = '<h2>' + esc(n.label || k) + (n.planned ? '<span class="tag plan">planned</span>' : '') + '</h2>';
    h += '<p class="role">' + esc(n.role) + '</p><table>';
    if (n.mgmt) h += '<tr><td>Mgmt</td><td>' + esc(n.mgmt) + '</td></tr>';
    n.iface.forEach((r) => { h += '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; });
    h += '<tr><td>RAM</td><td>' + esc(n.ram) + '</td></tr></table>';
    if (n.note) h += '<p class="hint">' + esc(n.note) + '</p>';
    if (n.faults.length) h += '<h3>Faults to inject</h3><ul>' + n.faults.map((f) => '<li>' + esc(f) + '</li>').join('') + '</ul>';
    h += '<h3>Devices</h3>' + chips();
    detail.innerHTML = h;
  }
  function select(k) {
    if (selected && nodes[selected]) nodes[selected].mesh.material.emissive.setHex(0x000000);
    selected = k;
    if (!k) { showOverview(); return; }
    if (nodes[k].planned && !groups.planned.visible) toggle('t-plan', true);
    if (nodes[k].zone === 'MGMT' && !groups.mgmt.visible) toggle('t-mgmt', true);
    nodes[k].mesh.material.emissive.setHex(0x1f4f55);
    showNode(k);
  }
  detail.addEventListener('click', (e) => {
    const b = e.target.closest('[data-node]');
    if (b) select(b.dataset.node);
  });

  // ---- Toggles --------------------------------------------------------------------
  let animate = !reduceMotion;
  function toggle(id, force) {
    const btn = document.getElementById(id);
    const on = force !== undefined ? force : btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (id === 't-ip') labelLayer.classList.toggle('hide-ip', !on);
    if (id === 't-mgmt') { groups.mgmt.visible = on; labelLayer.classList.toggle('hide-mgmt', !on); }
    if (id === 't-plan') { groups.planned.visible = on; labelLayer.classList.toggle('hide-planned', !on); }
    if (id === 't-anim') { animate = on; pulses.forEach((p) => (p.m.visible = on)); sshPulse.m.visible = on; }
  }
  ['t-ip', 't-mgmt', 't-plan', 't-anim'].forEach((id) =>
    document.getElementById(id).addEventListener('click', () => toggle(id)));
  document.getElementById('t-reset').addEventListener('click', () => { resetView(); select(null); });
  labelLayer.classList.add('hide-planned');
  if (!animate) toggle('t-anim', false);

  // ---- Picking --------------------------------------------------------------------
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let downAt = null;
  canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    ptr.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(pickables.filter((m) => {
      let o = m; while (o) { if (!o.visible) return false; o = o.parent; } return true;
    }), false)[0];
    select(hit ? hit.object.userData.name : null);
  });
  canvas.addEventListener('pointermove', (e) => {
    ptr.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    canvas.style.cursor = ray.intersectObjects(pickables, false).length ? 'pointer' : 'grab';
  });

  // ---- Loop -----------------------------------------------------------------------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  resetView();
  showOverview();

  const tmp = new THREE.Vector3();
  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    controls.update();
    if (animate) {
      pulses.forEach((p) => {
        p.t = (p.t + p.speed * dt) % 1;
        p.m.position.copy(p.curve.getPointAt(Math.min(p.t, 0.999)));
      });
      sshPulse.t += 0.35 * dt;
      if (sshPulse.t >= 1) {
        sshPulse.t = 0;
        sshPulse.idx = (sshPulse.idx + 1) % mgmtOf.length;
        sshPath = polyCurve(mgmtPaths[mgmtOf[sshPulse.idx]]);
      }
      sshPulse.m.position.copy(sshPath.getPointAt(Math.min(sshPulse.t, 0.999)));
    }
    renderer.render(scene, camera);

    const w = window.innerWidth, h = window.innerHeight;
    labels.forEach((l) => {
      tmp.copy(l.pos).project(camera);
      const behind = tmp.z > 1;
      l.el.style.visibility = behind ? 'hidden' : '';
      l.el.style.transform = 'translate(' + ((tmp.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - tmp.y) / 2 * h).toFixed(1) + 'px) ' +
        (l.el.classList.contains('plane') ? 'translate(0,-50%)' : l.el.classList.contains('link') || l.el.classList.contains('zone') ? 'translate(-50%,-50%)' : 'translate(-50%,-100%)');
    });
    requestAnimationFrame(frame);
  }
  // Place nodes at rest before the first frame (pulses start at their offsets).
  pulses.forEach((p) => p.m.position.copy(p.curve.getPointAt(Math.min(p.t, 0.999))));
  sshPulse.m.position.copy(sshPath.getPointAt(0));
  requestAnimationFrame(frame);
})();
</script>
