# NetWarden GNS3 lab - Stage B (docs/DESIGN.md section 9).
# Single source of truth for lab/build_gns3_lab.py.
#
# Ports are written the way the device names them. The build script maps them
# to GNS3 adapter/port numbers.

project: netwarden-lab

templates:
  iosv:
    name: NetWarden IOSv
    type: qemu
    image_env: LAB_IOSV_IMAGE        # file name in ~/GNS3/images/QEMU
    image_default: vios-adventerprisek9-m.spa.159-3.m9.qcow2
    ram: 512
    adapters: 4
    port_name_format: "Gi0/{0}"
  iosvl2:
    name: NetWarden IOSvL2
    type: qemu
    image_env: LAB_IOSVL2_IMAGE
    image_default: vios_l2-adventerprisek9-m.ssa.high_iron_20200929.qcow2
    ram: 768
    adapters: 16
    port_name_format: "Gi{1}/{0}"
    port_segment_size: 4
  ipterm:
    name: NetWarden ipterm
    type: docker
    image: gns3/ipterm:latest
  nginx:
    name: NetWarden nginx
    type: docker
    image: nginx:alpine

# x/y = position on the GNS3 canvas
nodes:
  R1:      {template: iosv,   x: -250, y: -100, config: configs/R1.cfg}
  R2:      {template: iosv,   x: -50,  y: -100, config: configs/R2.cfg}
  ISP1:    {template: iosv,   x: 200,  y: -100, config: configs/ISP1.cfg}
  BR1:     {template: iosv,   x: 450,  y: -100, config: configs/BR1.cfg}
  SW1:     {template: iosvl2, x: -450, y: -100, config: configs/SW1.cfg}
  PC1:     {template: ipterm, x: -650, y: -100, network: hosts/PC1.interfaces}
  PC2:     {template: ipterm, x: 650,  y: -100, network: hosts/PC2.interfaces}
  WEB1:    {template: nginx,  x: 200,  y: 80,   network: hosts/WEB1.interfaces}
  MGMT-SW: {builtin: ethernet_switch, x: 0, y: 250}
  MGMT-CLOUD: {builtin: cloud, x: -300, y: 250, tap: tap-nw}

links:
  # Data plane
  - [PC1 eth0, SW1 Gi1/0]
  - [SW1 Gi0/1, R1 Gi0/2]
  - [R1 Gi0/1, R2 Gi0/1]
  - [R2 Gi0/2, ISP1 Gi0/1]
  - [ISP1 Gi0/2, BR1 Gi0/1]
  - [ISP1 Gi0/3, WEB1 eth0]
  - [BR1 Gi0/2, PC2 eth0]
  # Management plane (VRF MGMT, 10.99.0.0/24)
  - [MGMT-CLOUD tap-nw, MGMT-SW 0]
  - [R1 Gi0/0, MGMT-SW 1]
  - [R2 Gi0/0, MGMT-SW 2]
  - [BR1 Gi0/0, MGMT-SW 3]
  - [ISP1 Gi0/0, MGMT-SW 4]
  - [SW1 Gi0/0, MGMT-SW 5]
  # MGMT-SW 6 is kept for FW1 (stage C)
