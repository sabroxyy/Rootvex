! NetWarden lab - ISP1. Secrets in double braces are filled from .env by build_gns3_lab.py.
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
hostname ISP1
!
no ip domain lookup
ip domain name lab.test
logging buffered 16384
!
username netwarden privilege 15 secret {{LAB_DEVICE_PASSWORD}}
enable secret {{LAB_DEVICE_PASSWORD}}
!
! --- Out-of-band management: own VRF so routing faults never cut the agent off
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
interface GigabitEthernet0/0
 description MGMT-SW (10.99.0.0/24)
 vrf forwarding MGMT
 ip address 10.99.0.14 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description to R2 Gi0/2 (AS 65001)
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description to BR1 Gi0/1 (AS 65002)
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description WEB1 segment
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
router bgp 65100
 bgp router-id 100.100.100.100
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 65001
 neighbor 203.0.113.1 description R2-HQ
 neighbor 198.51.100.2 remote-as 65002
 neighbor 198.51.100.2 description BR1-Branch
 address-family ipv4
  network 192.0.2.0
  network 198.51.100.0 mask 255.255.255.252
  network 203.0.113.0 mask 255.255.255.252
  neighbor 203.0.113.1 activate
  neighbor 198.51.100.2 activate
 exit-address-family
!
! --- DNS for the lab "internet"
ip dns server
ip host www.lab.test 192.0.2.80
!
! --- SSH only, and only from the NetWarden host
ip ssh version 2
ip access-list standard NW-MGMT
 permit host 10.99.0.1
crypto key generate rsa general-keys modulus 2048
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 access-class NW-MGMT in vrf-also
 exec-timeout 30 0
 login local
 transport input ssh
!
end
