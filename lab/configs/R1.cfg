! Rootvex lab - R1. Values in double braces (secrets, interface names) are filled in by build_gns3_lab.py.
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
hostname R1
!
no ip domain lookup
ip domain name lab.test
logging buffered 16384
!
username rootvex privilege 15 secret {{LAB_DEVICE_PASSWORD}}
enable secret {{LAB_DEVICE_PASSWORD}}
!
! --- Out-of-band management: own VRF so routing faults never cut the agent off
{{MGMT_VRF}}
!
interface {{IF_MGMT}}
 description MGMT-SW (10.99.0.0/24)
 {{MGMT_VRF_FWD}}
 ip address 10.99.0.11 255.255.255.0
 no shutdown
!
interface {{IF1}}
 description to R2
 ip address 10.0.12.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface {{IF2}}
 description HQ LAN (SW1)
 ip address 10.10.10.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface {{IF3}}
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface {{IF2}}
!
! Internet via R2
ip route 0.0.0.0 0.0.0.0 10.0.12.2
!
! --- SSH only, and only from the Rootvex host
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip access-list standard RV-MGMT
 permit host 10.99.0.1
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 access-class RV-MGMT in vrf-also
 exec-timeout 30 0
 login local
 transport input ssh
!
end
