! NetWarden lab - R1. Secrets in double braces are filled from .env by build_gns3_lab.py.
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
hostname R1
!
no ip domain lookup
ip domain name lab.test
logging buffered 16384
!
username netwarden privilege 15 secret {{LAB_DEVICE_PASSWORD}}
enable secret {{LAB_DEVICE_PASSWORD}}
!
! --- Out-of-band management: own VRF so routing faults never cut the agent off
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
interface GigabitEthernet0/0
 description MGMT-SW (10.99.0.0/24)
 vrf forwarding MGMT
 ip address 10.99.0.11 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description to R2 Gi0/1
 ip address 10.0.12.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/2
 description HQ LAN (SW1 Gi0/1)
 ip address 10.10.10.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/3
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/2
!
! Internet via R2
ip route 0.0.0.0 0.0.0.0 10.0.12.2
!
! --- SSH only, and only from the NetWarden host
ip ssh version 2
ip access-list standard NW-MGMT
 permit host 10.99.0.1
crypto key generate rsa general-keys modulus 2048
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 access-class NW-MGMT in vrf-also
 exec-timeout 30 0
 login local
 transport input ssh
!
end
