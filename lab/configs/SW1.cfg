! NetWarden lab - SW1 (IOSvL2). Secrets in double braces are filled from .env by build_gns3_lab.py.
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
hostname SW1
!
no ip domain lookup
ip domain name lab.test
logging buffered 16384
!
username netwarden privilege 15 secret {{LAB_DEVICE_PASSWORD}}
enable secret {{LAB_DEVICE_PASSWORD}}
!
vlan 10
 name HQ-USERS
vlan 99
 name MGMT
!
interface GigabitEthernet0/0
 description MGMT-SW
 switchport mode access
 switchport access vlan 99
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/1
 description R1 Gi0/2 (HQ gateway)
 switchport mode access
 switchport access vlan 10
 negotiation auto
 no shutdown
!
interface GigabitEthernet1/0
 description PC1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast edge
 negotiation auto
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description Management (10.99.0.0/24)
 ip address 10.99.0.21 255.255.255.0
 no shutdown
!
ip ssh version 2
ip access-list standard NW-MGMT
 permit host 10.99.0.1
crypto key generate rsa general-keys modulus 2048
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 access-class NW-MGMT in
 exec-timeout 30 0
 login local
 transport input ssh
!
end
