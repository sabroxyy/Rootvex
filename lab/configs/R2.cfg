! NetWarden lab - R2. Values in double braces (secrets, interface names) are filled in by build_gns3_lab.py.
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
hostname R2
!
no ip domain lookup
ip domain name lab.test
logging buffered 16384
!
username netwarden privilege 15 secret {{LAB_DEVICE_PASSWORD}}
enable secret {{LAB_DEVICE_PASSWORD}}
!
! --- Out-of-band management: own VRF so routing faults never cut the agent off
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
interface {{IF_MGMT}}
 description MGMT-SW (10.99.0.0/24)
 vrf forwarding MGMT
 ip address 10.99.0.12 255.255.255.0
 no shutdown
!
! --- IPsec VTI to the other site
crypto isakmp policy 10
 encryption aes 256
 hash sha
 authentication pre-share
 group 14
crypto isakmp key {{LAB_VPN_PSK}} address 198.51.100.2
crypto ipsec transform-set NW-TS esp-aes 256 esp-sha-hmac
 mode tunnel
crypto ipsec profile NW-VTI
 set transform-set NW-TS
!
interface {{IF1}}
 description to R1
 ip address 10.0.12.2 255.255.255.252
 ip nat inside
 ip ospf 1 area 0
 no shutdown
!
interface {{IF2}}
 description to ISP1 (AS 65100)
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 no shutdown
!
interface {{IF3}}
 shutdown
!
interface Tunnel0
 description IPsec VTI to BR1
 ip address 172.16.0.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf 1 area 0
 tunnel source {{IF2}}
 tunnel mode ipsec ipv4
 tunnel destination 198.51.100.2
 tunnel protection ipsec profile NW-VTI
!
router ospf 1
 router-id 2.2.2.2
!
! eBGP to the ISP. Learns 192.0.2.0/24 (web) and the branch WAN /30 (tunnel peer).
router bgp 65001
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 neighbor 203.0.113.2 remote-as 65100
 neighbor 203.0.113.2 description ISP1
 address-family ipv4
  network 203.0.113.0 mask 255.255.255.252
  neighbor 203.0.113.2 activate
 exit-address-family
!
! --- PAT for HQ users going to the "internet"
ip access-list standard NAT-HQ
 permit 10.10.10.0 0.0.0.255
 permit 10.0.12.0 0.0.0.3
ip nat inside source list NAT-HQ interface {{IF2}} overload
!
! --- SSH only, and only from the NetWarden host
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip access-list standard NW-MGMT
 permit host 10.99.0.1
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 access-class NW-MGMT in vrf-also
 exec-timeout 30 0
 login local
 transport input ssh
!
end
